# All-in-one stack: PostgreSQL + API + web. Used for self-hosting on a single machine.
# Copy .env.example to .env and fill it in first. Nothing here has a built-in password.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fixbounty}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-fixbounty}
    volumes:
      - fixbounty_pgdata:/var/lib/postgresql/data
    networks:
      - fixbounty-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fixbounty} -d ${POSTGRES_DB:-fixbounty}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-fixbounty}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-fixbounty}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:?Set FIREBASE_PROJECT_ID in .env}
      ADMIN_EMAILS: ${ADMIN_EMAILS:?Set ADMIN_EMAILS in .env}
      ARC_RPC_URL: ${ARC_RPC_URL:-https://rpc.testnet.arc.io}
      CHAIN_ID: ${VITE_ARC_CHAIN_ID:-5042002}
      EXPLORER_URL: ${VITE_ARC_EXPLORER_URL:-https://explorer.testnet.arc.io}
      BOUNTY_BOARD_ADDRESS: ${BOUNTY_BOARD_ADDRESS:-}
      INDEXER_START_BLOCK: ${INDEXER_START_BLOCK:-}
      USDC_ADDRESS: ${USDC_ADDRESS:-0x3600000000000000000000000000000000000000}
      TREASURY_ADDRESS: ${TREASURY_ADDRESS:?Set TREASURY_ADDRESS in .env}
    networks:
      - fixbounty-net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET:-}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:-}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID}
        VITE_FIREBASE_MEASUREMENT_ID: ${VITE_FIREBASE_MEASUREMENT_ID:-}
        VITE_ARC_RPC_URL: ${VITE_ARC_RPC_URL:-https://rpc.testnet.arc.io}
        VITE_ARC_CHAIN_ID: ${VITE_ARC_CHAIN_ID:-5042002}
        VITE_ARC_EXPLORER_URL: ${VITE_ARC_EXPLORER_URL:-https://explorer.testnet.arc.io}
        VITE_WALLETCONNECT_PROJECT_ID: ${VITE_WALLETCONNECT_PROJECT_ID:-}
        VITE_API_URL: ${VITE_API_URL:-/api}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"
    networks:
      - fixbounty-net

volumes:
  fixbounty_pgdata:
    name: fixbounty_pgdata

networks:
  fixbounty-net:
    driver: bridge
