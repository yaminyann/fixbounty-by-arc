version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: fixbounty-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fixbounty}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fixbounty_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-fixbounty}
    volumes:
      - fixbounty_pgdata_dev:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fixbounty} -d ${POSTGRES_DB:-fixbounty}"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 2s

volumes:
  fixbounty_pgdata_dev:
    name: fixbounty_pgdata_dev
