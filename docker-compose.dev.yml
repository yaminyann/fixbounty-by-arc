# Local PostgreSQL for development. Listens on localhost only.
#   docker compose -f docker-compose.dev.yml up -d
#   DATABASE_URL=postgresql://postgres:devpassword@localhost:5432/fixbounty
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: fixbounty
    volumes:
      - fixbounty_pgdata_dev:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fixbounty"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  fixbounty_pgdata_dev:
    name: fixbounty_pgdata_dev
