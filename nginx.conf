events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    server_tokens off;
    client_max_body_size 128k;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Headers that never interfere with scripts, wallets or Google sign-in.
    # A stricter script-src policy can be added once the production domains are fixed.
    # Locations below only use "expires": a location that sets its own add_header would drop these.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "frame-ancestors 'self'; base-uri 'self'; object-src 'none'; form-action 'self'" always;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        location /api/ {
            proxy_pass http://fixbounty-api:4000/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        location = /health {
            proxy_pass http://fixbounty-api:4000/health;
        }

        # Hashed build files never change, so browsers can keep them for a year.
        location /assets/ {
            expires 1y;
            try_files $uri =404;
        }

        # The shell is always revalidated so a new deploy is picked up at once.
        location / {
            expires -1;
            try_files $uri $uri/ /index.html;
        }
    }
}
