# Coolify deployment. The database is the PostgreSQL resource created in Coolify, so there is no
# postgres service here: set DATABASE_URL to it. In the Coolify resource settings enable
# "Connect to Predefined Network" so the backend can reach that database by its internal hostname.
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:?Set FIREBASE_PROJECT_ID}
      ADMIN_EMAILS: ${ADMIN_EMAILS:?Set ADMIN_EMAILS}
      ARC_RPC_URL: ${ARC_RPC_URL:-https://rpc.testnet.arc.io}
      CHAIN_ID: ${VITE_ARC_CHAIN_ID:-5042002}
      EXPLORER_URL: ${VITE_ARC_EXPLORER_URL:-https://explorer.testnet.arc.io}
      BOUNTY_BOARD_ADDRESS: ${BOUNTY_BOARD_ADDRESS:-}
      INDEXER_START_BLOCK: ${INDEXER_START_BLOCK:-}
      USDC_ADDRESS: ${USDC_ADDRESS:-0x3600000000000000000000000000000000000000}
      TREASURY_ADDRESS: ${TREASURY_ADDRESS:?Set TREASURY_ADDRESS}
    networks:
      - fixbounty-net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET:-}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:-}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID}
        VITE_FIREBASE_MEASUREMENT_ID: ${VITE_FIREBASE_MEASUREMENT_ID:-}
        VITE_ARC_RPC_URL: ${VITE_ARC_RPC_URL:-https://rpc.testnet.arc.io}
        VITE_ARC_CHAIN_ID: ${VITE_ARC_CHAIN_ID:-5042002}
        VITE_ARC_EXPLORER_URL: ${VITE_ARC_EXPLORER_URL:-https://explorer.testnet.arc.io}
        VITE_WALLETCONNECT_PROJECT_ID: ${VITE_WALLETCONNECT_PROJECT_ID:-}
        VITE_API_URL: ${VITE_API_URL:-/api}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - fixbounty-net

networks:
  fixbounty-net:
    driver: bridge
